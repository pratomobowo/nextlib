# =============================================================================
# NextLib Platform — Coolify / Production compose
# =============================================================================
# Production-ready stack. Use this on Coolify (set as the Compose file / Base
# Compose File in the service settings) instead of the local-dev docker-compose.yml.
#
# Differences vs. the local-dev compose:
#   • `app` builds the `runner` target (Next.js production server), NOT `dev`.
#   • No host bind-mounts — code is baked into the image, as Coolify expects.
#   • PostgreSQL gets a real password (POSTGRES_PASSWORD must be set in Coolify).
#   • App/worker run migrations on boot via docker-entrypoint.sh.
#   • Internal service ports are NOT published to the host — Coolify's proxy
#     terminates TLS and routes :3000. DB/Redis stay private to the stack.
#
# ── Secrets to set in Coolify (Environment / .env) ──────────────────────────
#   DATABASE_URL            — REQUIRED. Must be set explicitly in Coolify's
#                             env vars (Stack → Environment, or per-service).
#                             Password must be URL-encoded. Example for
#                             password 'N3xt@#1234':
#                               postgresql://nextlib:N3xt%40%231234@db:5432/nextlib_cloud
#                             Encoding map: @ → %40, # → %23, : → %3A, / → %2F,
#                             % → %25, ? → %3F, [ → %5B, ] → %5D
#                             (or use any online "URL encode" tool).
#                             Why we use plain ${VAR} (no bash :- or :? fallback):
#                             Coolify's Blade template parser chokes on nested
#                             or bash-style expansions. We rely on Coolify to
#                             fail-loud if the var is missing, instead of
#                             trying to default in compose.
#   POSTGRES_PASSWORD       — raw password used by the Postgres init script
#                             (e.g. N3xt@#1234 — must match the un-encoded form
#                             used in DATABASE_URL).
#   AES_256_ENCRYPTION_KEY  — 64-hex-char AES-256 key  (openssl rand -hex 32)
#   NEXTAUTH_SECRET         — 64-hex-char NextAuth key (openssl rand -hex 32)
#   NEXTAUTH_URL            — public URL, e.g. https://nextlib.yourdomain.com
#   WHATSAPP_WEBHOOK_SECRET — HMAC secret shared with the Gowa engine
#                             (openssl rand -hex 24)
# Optional:
#   AI_BASE_URL (default https://api.deepseek.com)
#   AI_MODEL    (default deepseek-chat)
#   AI_API_KEY  (optional, only if using the AI librarian)
#
# ── How to deploy on Coolify ────────────────────────────────────────────────
#   1. New Resource → Docker Compose (empty) → paste this file, OR point the
#      repo + set "Base Compose File" to docker-compose.coolify.yml.
#   2. Add the secrets above under Environment (type: secret so they're masked).
#   3. Set the exposed port to 3000 and attach a domain (Coolify provisions TLS).
#   4. Deploy. Healthcheck: GET http://app:3000/api/v1/nextlib/health
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Real auth in production — POSTGRES_PASSWORD is required.
    environment:
      # Real auth in production — POSTGRES_PASSWORD must be set in Coolify
      # env vars (raw value, e.g. "N3xt@#1234" — NOT URL-encoded; only the
      # password embedded in DATABASE_URL needs URL-encoding).
      POSTGRES_USER: ${POSTGRES_USER:-nextlib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextlib_cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nextlib_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextlib} -d ${POSTGRES_DB:-nextlib_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - nextlib_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    restart: unless-stopped
    volumes:
      - gowa_storage:/app/storages
    environment:
      - APP_PORT=3000
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      # Webhook calls back into the app service (in-network, not via host).
      - WHATSAPP_WEBHOOK=http://app:3000/api/v1/whatsapp/webhook
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
    command: rest
    networks:
      - nextlib_net

  app:
    build:
      # Build context is the repo root so the Dockerfile can also COPY the
      # nextlib-agent/ source (the SaaS /agent-zip endpoint bundles the
      # plugin into a per-tenant ZIP at request time).
      context: .
      dockerfile: ./nextlib-cloud/Dockerfile
      # Production server target — NOT development. Code is baked into the image.
      target: runner
    restart: unless-stopped
    # No `ports` published here. Coolify's own proxy (Traefik) terminates TLS
    # and routes the attached domain to this service on its internal port. If we
    # bind 0.0.0.0:3000 here it collides with the proxy on a single-host setup
    # ("port is already allocated"). Tell Coolify the exposed port in the UI
    # (Port = 3000) instead.
    expose:
      - "3000"
    environment:
      # DATABASE_URL — set in Coolify env vars with URL-encoded password.
      # See top-of-file docs for the encoding map and worked example.
      - DATABASE_URL=${DATABASE_URL}
      - AES_256_ENCRYPTION_KEY=${AES_256_ENCRYPTION_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_API_URL=http://gowa:3000
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - NODE_ENV=production
      # Only the web server migrates; the worker waits for the DB and skips.
      - RUN_MIGRATIONS=1
      # Pin port + hostname explicitly. Dockerfile already sets these via
      # ENV PORT 3000 / ENV HOSTNAME "0.0.0.0", but Coolify's build-time.env
      # generator has been observed injecting PORT=5432 (likely auto-derived
      # from DATABASE_URL) which made next start bind to the Postgres port
      # instead of 3000 — breaking the Traefik proxy.
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextlib_net

  # WhatsApp message worker (BullMQ consumer). Shares the image/env with the
  # web server but targets the `worker` stage. No published port.
  worker:
    build:
      context: .
      dockerfile: ./nextlib-cloud/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      # Same as `app` — see comment there. Must be URL-encoded; no fallback.
      - DATABASE_URL=${DATABASE_URL}
      - AES_256_ENCRYPTION_KEY=${AES_256_ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_API_URL=http://gowa:3000
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextlib_net

volumes:
  postgres_data:
  redis_data:
  gowa_storage:

networks:
  nextlib_net:
    driver: bridge
